{% extends "basis.html" %}{% block titel %}Anmelden{% endblock %}
{% block inhalt %}
<section class="karte schmal">
<h1>Anmelden</h1>
{% if fehler %}<p class="fehler">{{ fehler }}</p>{% endif %}
<form method="post" action="/anmelden">
  <label>Kennung <input name="kennung" autocomplete="username" required></label>
  <label>Passwort <input name="passwort" type="password" autocomplete="current-password" required></label>
  <button>Anmelden</button>
</form>
<p class="klein">Demo-Kennungen: sb.a, sb.b (Sachbearbeitung), pruef.a (Prüfung), admin (Administration). Passwort laut Start-Konfiguration (DEMO_PASSWORT).</p>
</section>
{% endblock %}
