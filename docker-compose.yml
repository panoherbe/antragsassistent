# Prototyp lokal: Sprachmodell (Ollama, offene Modelle, GPU) + Anwendung. Beides bleibt auf diesem Rechner;
# die Anwendung lauscht nur auf 127.0.0.1. Start:
#   DEMO_PASSWORT=... docker compose up -d                 # Oberfläche: http://127.0.0.1:${APP_PORT:-8420}
#   docker compose exec ollama ollama pull qwen3.8:27b && docker compose exec ollama ollama pull qwen3-embedding:4b
#   docker compose run --rm test                           # Tests (ohne Modell)
#   docker compose run --rm app python -m eval.messen --ausgabe nachweis/neu
# Gemessen auf einer GPU mit 12 GB (11.11.2026): qwen3.8:27b liegt zu gut der Hälfte auf der GPU, der Rest im
# Arbeitsspeicher (gemessen mit 62 GB RAM); die Einbettungen rechnet der Prozessor (EINBETTUNG_CPU=1), damit das
# Sprachmodell geladen bleibt. Auf einer GPU ab 24 GB sollten beide Modelle Platz haben (nicht gemessen): EINBETTUNG_CPU=0.
name: antragsassistent
services:
  ollama:
    image: ollama/ollama:0.40.16
    volumes: ["./daten/ollama:/root/.ollama"]
    environment: [OLLAMA_KEEP_ALIVE=60m, OLLAMA_MAX_LOADED_MODELS=2]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
  app:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      SPRACHMODELL: ${SPRACHMODELL:-qwen3.8:27b}
      EINBETTUNGSMODELL: ${EINBETTUNGSMODELL:-qwen3-embedding:4b}
      EINBETTUNG_CPU: ${EINBETTUNG_CPU:-1}
      DEMO_PASSWORT: ${DEMO_PASSWORT:?DEMO_PASSWORT setzen}
      DEMO_FAELLE: ${DEMO_FAELLE:-20}
    volumes: ["./daten:/app/daten", "./nachweis:/app/nachweis"]
    ports: ["127.0.0.1:${APP_PORT:-8420}:8000"]
    depends_on: [ollama]
  test:
    build: .
    environment: {DATENVERZEICHNIS: /tmp/test, DEMO_PASSWORT: nur-fuer-tests}
    entrypoint: ["python", "-m", "pytest", "-q", "tests"]
    profiles: [test]
